<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORATOR - Executive Speaking Coach</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙</text></svg>">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>ORATOR</h1>
      <div class="tag">Executive Speaking Program</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="spacer"></div>
      <div style="display:flex;align-items:center;gap:14px">
        <div class="streak" title="Consecutive days of practice">
          <span>🔥</span><span id="streakVal">0</span><span style="color:var(--fg-3);font-weight:500">day streak</span>
        </div>
        <div style="font-size:11.5px;color:var(--fg-3);font-family:var(--mono)" title="Live coach model">
          <span class="dot ok" id="studioDot"></span> <span id="modelVal">-</span>
        </div>
      </div>
    </header>

    <div class="content" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
